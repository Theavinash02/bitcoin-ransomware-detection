seed: 42
n_jobs: 4

paths:
  raw: data/raw
  processed: data/processed
  reports: reports
  models: models

sources:
  bitcoinheist_url: https://archive.ics.uci.edu/static/public/526/bitcoinheistransomwareaddressdataset.zip
  # Zenodo concept record; download resolves the latest version.
  ransomwhere_record: "6512122"
  price_url: https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=PriceUSD&frequency=1d&start_time=2010-07-18&page_size=10000&format=csv

dev:
  rows: 200000

split:
  # Split C from the data audit. Train is everything before val_start.
  val_start: "2016-07-01"
  test_start: "2017-01-01"

metrics:
  target_fpr: 0.001
  top_k: 10

sampling:
  white_train_fraction: 0.15

lightgbm:
  n_estimators: 2000
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  feature_fraction: 0.9
  early_stopping_rounds: 100

old_protocol:
  test_size: 0.2
  rf:
    n_estimators: 100
    max_depth: 20
    min_samples_leaf: 25

feature_ablation:
  # Smallest validation gain that counts as an improvement, to ignore noise.
  min_gain: 0.002

final_model:
  trials: 30
  smote_ratio: 0.5
  search:
    num_leaves: [15, 31, 63, 127, 255]
    learning_rate: [0.02, 0.05, 0.1]
    min_child_samples: [20, 50, 100, 200, 500]
    feature_fraction: [0.6, 0.8, 1.0]
    # Multiplies the balanced positive-class weight.
    pos_weight_scale: [0.25, 0.5, 1.0, 2.0]

generalization:
  min_family_addresses: 200

explanation:
  shap_rows: 5000

demo:
  rows: 5000
  ransom_share: 0.3
